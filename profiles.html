<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Profiles Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #d9f5f7;
      margin: 0;
      padding: 0;
    }

    /* Navbar */
    nav {
      background-color: #00060c;
      padding: 15px 30px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-weight: bold;
      font-size: 1.3em;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 1em;
    }

    nav ul li a:hover {
      text-decoration: underline;
    }

    /* Profiles Grid */
    .profiles-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 1200px;
      margin: auto;
    }

    .profile-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .profile-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .name {
      font-weight: bold;
      font-size: 1.1em;
    }

    .role {
      font-size: 0.9em;
      color: #1d0303;
      margin: 5px 0 15px;
    }

    .connect-btn {
      background-color: #266f71;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 0.9em;
    }

    .connect-btn:hover {
      background-color: #266f71;
    }

    .btn-custom {
            background-color: #266f71;
            color: #000;
            border-radius: 20px;
            padding: 5px 15px;
            margin-left: 10px;
        }
        .btn-custom:hover {
            background-color: #f9f8f6;
        }

    /* Footer */
    footer {
      background-color: #020d18;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }

    @media (max-width: 768px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
      }

      nav ul {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="logo">Profiles</div>
    
  </nav>

  <!-- Profile Cards -->
  <div class="profiles-container">
    <div class="profile-card">
      <img src="ashifa.jpg" class="profile-img" alt="Profile Photo">
      <div class="name">Dr. Ashifa Kaleel Rahuman MBBS(B.Pharm)</div>
      <div class="role">Health Assistance</div>
      <button class="connect-btn">+ Connect</button>
    </div>

    <div class="profile-card">
        <img src="ashifa.jpg" class="profile-img" alt="Profile Photo">
        <div class="name">Dr. Ashifa Kaleel Rahuman MBBS(B.Pharm)</div>
        <div class="role">Health Assistance</div>
        <button class="connect-btn">+ Connect</button>
      </div>

      <div class="profile-card">
        <img src="ashifa.jpg" class="profile-img" alt="Profile Photo">
        <div class="name">Dr. Ashifa Kaleel Rahuman MBBS(B.Pharm)</div>
        <div class="role">Health Assistance</div>
        <button class="connect-btn">+ Connect</button>
      </div>

  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Profiles. All rights reserved.
  </footer>

</body>
</html>
