<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caretaker Job Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            background: rgb(93, 103, 110);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-image: url('images.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: rgb(40, 39, 46);
        }
        .form-container label {
            font-weight: bold;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
        .form-control:hover {
            background-color: rgb(238, 245, 251);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center mb-4">Caretaker Job Application</h2>
        <h4 class="text-center mb-4">Skills and Education Details</h4>
        <form id="caretakerForm">
            <div class="mb-3">
                <label for="education">Education Qualification</label>
                <input type="text" class="form-control" id="education" placeholder="Enter your qualification">
                <span class="error" id="educationError"></span>
            </div>

            <div class="mb-3">
                <label for="yearOfCompletion">Year of Completion</label>
                <input type="number" class="form-control" id="yearOfCompletion" placeholder="Enter year of completion">
                <span class="error" id="yearError"></span>
            </div>

            <div class="mb-3">
                <label>Skills</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="skill1" value="driving assistance">
                    <label class="form-check-label" for="skill1">Driving Assistance</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="skill2" value="health assistance">
                    <label class="form-check-label" for="skill2">Health Assistance</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="skill3" value="delivering groceries">
                    <label class="form-check-label" for="skill3">Delivering Groceries</label>
                </div>
                <span class="error" id="skillsError"></span>
            </div>

            <div class="mb-3">
                <label for="expectedSalary">Expected Salary</label>
                <input type="text" class="form-control" id="expectedSalary" placeholder="Enter your expected salary">
                <span class="error" id="salaryError"></span>
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-primary" onclick="handleSubmit()">Submit</button>
                <button type="button" class="btn btn-secondary" onclick="handleReset()">Reset</button>
            </div>
        </form>
    </div>
</body>
</html>
