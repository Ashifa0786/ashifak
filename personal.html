<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caretaker Job Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            background: rgb(93, 103, 110);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            background-image: url('images.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: rgb(40, 39, 46);
        }
        .form-container label {
            font-weight: bold;
        }
        #output {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
        .form-control:hover {
            background-color: rgb(238, 245, 251);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 class="text-center mb-4">Caretaker Job Application</h2>
        <h4 class="text-center mb-4">Personal Information</h4>
        <form id="caretakerForm">

            <div class="mb-3">
                <label>Gender</label><br>
                <input type="radio" name="gender" id="male" value="Male"> <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="Female"> <label for="female">Female</label>
                <input type="radio" name="gender" id="other" value="Other"> <label for="other">Other</label>
                <span class="error" id="genderError"></span>
            </div>

            <div class="mb-3">
                <label for="weight">Weight (kg)</label>
                <input type="number" class="form-control" id="weight" placeholder="Enter your weight">
                <span class="error" id="weightError"></span>
            </div>


            <div class="mb-3">
                <label for="nativeState">Native State</label>
                <select class="form-control" id="nativeState">
                    <option value="">Select State</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                </select>
                <span class="error" id="nativeStateError"></span>
            </div>

            <div class="mb-3">
                <label for="native">Native</label>
                <input type="text" class="form-control" id="native" placeholder="Enter your native place">
                <span class="error" id="nativeError"></span>
            </div>

            <div class="mb-3">
                <label for="currentLocation">Current Location</label>
                <input type="text" class="form-control" id="currentLocation" placeholder="Enter your current location">
                <span class="error" id="currentLocationError"></span>
            </div>

            

            

            

            <div class="text-center">
                <button type="button" class="btn btn-primary" onclick="redirectToPage()">Next</button>
                <button type="reset" class="btn btn-secondary">Reset</button>
            </div>
        </form>
        
    </div>
    <script>
        

        function redirectToPage() {
                    window.location.href = "edu.html"; 
                }
    </script>
</body>
</html>
