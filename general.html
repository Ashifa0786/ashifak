<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caretaker Job Application</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding: 20px;
    }

    .form-container {
      max-width: 650px;
      margin: auto;
      background: rgba(179, 218, 225, 0.9);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      background-image: url('images.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #212529;
    }

    .form-container label {
      font-weight: 600;
    }

    .error {
      color: red;
      font-size: 0.85em;
    }

    .form-control:hover {
      background-color: rgb(238, 245, 251);
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2 class="text-center mb-4">Caretaker Job Application</h2>
    <form id="caretakerForm" novalidate>

      <!-- Name -->
      <div class="mb-3">
        <label for="name">Name</label>
        <input type="text" class="form-control" id="name">
        <span class="error" id="nameError"></span>
      </div>

      <!-- Aadhaar -->
      <div class="mb-3">
        <label for="aadhaar">Aadhaar Number</label>
        <input type="text" class="form-control" id="aadhaar">
        <span class="error" id="aadhaarError"></span>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email">Email</label>
        <input type="email" class="form-control" id="email">
        <span class="error" id="emailError"></span>
      </div>

      <!-- Mobile -->
      <div class="mb-3">
        <label for="mobile">Mobile Number</label>
        <input type="text" class="form-control" id="mobile">
        <span class="error" id="mobileError"></span>
      </div>

      <!-- Age -->
      <div class="mb-3">
        <label for="age">Age</label>
        <input type="number" class="form-control" id="age">
        <span class="error" id="ageError"></span>
      </div>

      <!-- Gender -->
      <div class="mb-3">
        <label>Gender</label><br>
        <input type="radio" name="gender" value="Male" id="male"> <label for="male">Male</label>
        <input type="radio" name="gender" value="Female" id="female"> <label for="female">Female</label>
        <input type="radio" name="gender" value="Other" id="other"> <label for="other">Other</label>
        <br><span class="error" id="genderError"></span>
      </div>

      <!-- Weight -->
      <div class="mb-3">
        <label for="weight">Weight (kg)</label>
        <input type="number" class="form-control" id="weight">
        <span class="error" id="weightError"></span>
      </div>

      <!-- Native State -->
      <div class="mb-3">
        <label for="nativeState">Native State</label>
        <select class="form-control" id="nativeState">
          <option value="">Select State</option>
          <option value="Tamil Nadu">Tamil Nadu</option>
          <option value="Kerala">Kerala</option>
          <option value="Karnataka">Karnataka</option>
          <option value="Andhra Pradesh">Andhra Pradesh</option>
        </select>
        <span class="error" id="nativeStateError"></span>
      </div>

      <!-- Native -->
      <div class="mb-3">
        <label for="native">Native</label>
        <input type="text" class="form-control" id="native">
        <span class="error" id="nativeError"></span>
      </div>

      <!-- Current Location -->
      <div class="mb-3">
        <label for="currentLocation">Current Location</label>
        <input type="text" class="form-control" id="currentLocation">
        <span class="error" id="currentLocationError"></span>
      </div>

      <!-- Year of Completion -->
      <div class="mb-3">
        <label for="yearOfCompletion">Year of Completion</label>
        <input type="number" class="form-control" id="yearOfCompletion">
        <span class="error" id="yearError"></span>
      </div>

      <!-- Skills -->
      <div class="mb-3">
        <label>Skills</label>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="skill1" value="Driving Assistance">
          <label class="form-check-label" for="skill1">Driving Assistance</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="skill2" value="Health Assistance">
          <label class="form-check-label" for="skill2">Health Assistance</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="skill3" value="Delivering Groceries">
          <label class="form-check-label" for="skill3">Delivering Groceries</label>
        </div>
        <span class="error" id="skillsError"></span>
      </div>

      <!-- Expected Salary -->
      <div class="mb-3">
        <label for="expectedSalary">Expected Salary</label>
        <input type="text" class="form-control" id="expectedSalary">
        <span class="error" id="salaryError"></span>
      </div>

      <!-- Buttons -->
      <div class="text-center">
        <button type="button" class="btn btn-primary" onclick="handleSubmit()">Submit</button>
        <button type="button" class="btn btn-secondary" onclick="handleReset()">Reset</button>
      </div>
    </form>
  </div>

  <!-- Script -->
  <script>
    function handleSubmit() {
      let valid = true;

      // Helper
      const get = id => document.getElementById(id);
      const setError = (id, message) => { get(id).textContent = message; valid = false; };
      const clearErrors = () => {
        document.querySelectorAll('.error').forEach(e => e.textContent = '');
      };

      clearErrors();

      // Name
      const name = get("name").value.trim();
      if (name === "") setError("nameError", "Name is required.");

      // Aadhaar
      const aadhaar = get("aadhaar").value.trim();
      if (!/^\d{12}$/.test(aadhaar)) setError("aadhaarError", "Enter a valid 12-digit Aadhaar number.");

      // Email
      const email = get("email").value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) setError("emailError", "Invalid email format.");

      // Mobile
      const mobile = get("mobile").value.trim();
      if (!/^[6-9]\d{9}$/.test(mobile)) setError("mobileError", "Enter a valid 10-digit mobile number.");

      // Age
      const age = parseInt(get("age").value);
      if (!age || age < 18 || age > 70) setError("ageError", "Age must be between 18 and 70.");

      // Gender
      const gender = document.querySelector('input[name="gender"]:checked');
      if (!gender) setError("genderError", "Please select a gender.");

      // Weight
      const weight = parseFloat(get("weight").value);
      if (!weight || weight < 30 || weight > 200) setError("weightError", "Enter a valid weight between 30-200 kg.");

      // Native State
      if (get("nativeState").value === "") setError("nativeStateError", "Please select your native state.");

      // Native
      if (get("native").value.trim() === "") setError("nativeError", "Enter your native place.");

      // Current Location
      if (get("currentLocation").value.trim() === "") setError("currentLocationError", "Enter your current location.");

      // Year of Completion
      const year = parseInt(get("yearOfCompletion").value);
      const currentYear = new Date().getFullYear();
      if (!year || year < 1950 || year > currentYear) setError("yearError", "Enter a valid year.");

      // Skills
      const skills = ["skill1", "skill2", "skill3"].filter(id => get(id).checked);
      if (skills.length === 0) setError("skillsError", "Select at least one skill.");

      // Expected Salary
      if (get("expectedSalary").value.trim() === "") setError("salaryError", "Expected salary is required.");

      if (valid) {
        alert("Form submitted successfully!");
        // window.location.href = "/personal.html"; // Optional redirect
      }
    }

    function handleReset() {
      document.getElementById("caretakerForm").reset();
      document.querySelectorAll('.error').forEach(e => e.textContent = '');
    }
  </script>

</body>
</html>
